function hashSeed(str) {
  let h = 1779033703 ^ str.length;

    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);

    for (let i = 0; i < 2; i++) cards.push(pickCard(byTier, weightedTier(mid)));
    for (let i = 0; i < 2; i++) cards.push(pickCard(byTier, weightedTier(hit)));
  }
  const isEcho = Math.random() < echoChance;
  if (isEcho) cards[cards.length - 1] = ECHO_CARD;
  return { cards, isGodPack, isEcho, premium };
}

const SIBLING_CHANCE = 0.0002; // 0.02%
function rollGenesisPack(genesisPool, luckActive = false) {
  const byTier = cardsByTier(genesisPool);
  let base = BASE_SLOT, mid = MID_SLOT, hit = HIT_SLOT, god = GOD_SLOT;
  if (luckActive) { base = applyLuck(base); mid = applyLuck(mid); hit = applyLuck(hit); god = applyLuck(god); }
  let godChance = GOD_PACK_CHANCE;
  let sibChance = SIBLING_CHANCE;
  if (luckActive) { godChance *= LUCK_MULT; sibChance *= LUCK_MULT; }
  const isGodPack = Math.random() < godChance;
  const cards = [];
  if (isGodPack) {
    for (let i = 0; i < 8; i++) cards.push(pickCard(byTier, weightedTier(god)));
  } else {
    for (let i = 0; i < 4; i++) cards.push(pickCard(byTier, weightedTier(base)));
    for (let i = 0; i < 2; i++) cards.push(pickCard(byTier, weightedTier(mid)));
    for (let i = 0; i < 2; i++) cards.push(pickCard(byTier, weightedTier(hit)));
  }
  const isSibling = Math.random() < sibChance;
  if (isSibling) cards[cards.length - 1] = Math.random() < 0.5 ? NEON_CARD : DROGEN_CARD;
  return { cards, isGodPack, isSibling, deck: "genesis" };
}

/* ---------- Purchasable moves (shop) ---------- */
// minTier gates which cards are strong enough to learn a move.
// type must match the card's own type (Echo can learn anything).
// Every card has a maximum number of equipped attacks; rarer cards have more slots.
const MOVE_SLOTS = {
  common: 2, uncommon: 2, rare: 2,
  doubleRare: 3, artist: 3, signature: 3, scene: 3, prism: 3,
  champion: 4, prismSignature: 4, gilded: 4, echo: 4, siblings: 4,
};
function moveSlotsFor(card) { return MOVE_SLOTS[card.tier] || 2; }
// A card's library = its 2 innate moves + every move bought for it.
function libraryOf(card, purchased) { return [...genMoves(card), ...(purchased || [])]; }
function equippedOf(card, purchased, loadoutIds) {
  const lib = libraryOf(card, purchased);
  const slots = moveSlotsFor(card);
  const chosen = (loadoutIds || []).map((id) => lib.find((m) => m.id === id)).filter(Boolean).slice(0, slots);
  if (chosen.length) return chosen;
  return [...lib].sort((a, b) => b.power - a.power).slice(0, slots); // default: strongest moves
}

function canLearnMove(card, move, learnedList) {
  if (!card || card.category === "handler") return { ok: false, why: "Handlers can't learn moves" };
  const list = learnedList || [];
  if (list.some((m) => m.id === move.id)) return { ok: false, why: "Already learned" };
  const isEcho = card.tier === "echo";
  if (!isEcho && move.type === "echo") return { ok: false, why: "Only Echo can learn this" };
  if (!isEcho && move.type !== card.type) return { ok: false, why: `Needs a ${TYPE_MAP[move.type].name} card` };
  if (TIER_ORDER.indexOf(card.tier) < TIER_ORDER.indexOf(move.minTier)) {
    return { ok: false, why: `Needs ${TIER_MAP[move.minTier].label} or higher` };
  }
  return { ok: true, why: "" };
}

const TRADER_KEY = "emberwild-trader";
const TRADER_VISIT_MS = 8 * 60 * 1000;   // trader stays 8 minutes
const TRADER_GAP_MS = 4 * 60 * 1000;     // then comes back 4 minutes after leaving
const TRADER_STOCK = 20;
const TRADER_ECHO_CHANCE = 0.0025; // 0.25% per visit — half of each sibling's 0.5%
const TRADER_REFRESH_COST = 2000;
const TRADER_MIXED_MULT = 2;      // paying with cards AND coins: the price is 2x
const TRADER_COIN_ONLY_MULT = 4;  // paying with coins alone: the price is 4x
// Echo, Neon and Drogen can only be traded for cards — never bought with coins.
function evaluateTrade(card, cardsValue, coinsOffered) {
  const v = cardValue(card);
  if (GOD_TIERS.includes(card.tier) || coinsOffered <= 0) {
    return { mode: "cards", required: v, paid: cardsValue, ok: cardsValue >= v };
  }
  if (cardsValue <= 0) {
    return { mode: "coins", required: v * TRADER_COIN_ONLY_MULT, paid: coinsOffered, ok: coinsOffered >= v * TRADER_COIN_ONLY_MULT };
  }
  return { mode: "mixed", required: v * TRADER_MIXED_MULT, paid: cardsValue + coinsOffered, ok: cardsValue + coinsOffered >= v * TRADER_MIXED_MULT };
}

// Rarer tiers are much less likely to appear in the trader's stock
const TRADER_WEIGHTS = [
  ["common", 40], ["uncommon", 24], ["rare", 14], ["doubleRare", 8],
  ["artist", 5], ["signature", 3], ["scene", 2], ["prism", 1.5],
  ["champion", 0.6], ["prismSignature", 0.8], ["gilded", 0.4],
];

    if (raw) return JSON.parse(raw);
  } catch (e) { /* none stored yet */ }
  return null;
}
function saveTrader(d) {

  catch (e) { /* best effort */ }
}

const TRADER_SIBLING_CHANCE = 0.01;
function rollTraderStock(pool) {
  const byTier = cardsByTier(pool);
  const hasEcho = Math.random() < TRADER_ECHO_CHANCE;
  const hasSibling = Math.random() < TRADER_SIBLING_CHANCE;
  const siblingCard = hasSibling ? (Math.random() < 0.5 ? NEON_CARD : DROGEN_CARD) : null;
  const ids = [];
  const target = TRADER_STOCK - (hasEcho ? 1 : 0) - (hasSibling ? 1 : 0);
  let guard = 0;
  while (ids.length < target && guard++ < 500) {
    const tier = weightedTier(TRADER_WEIGHTS);
    const arr = byTier[tier];
    if (!arr || !arr.length) continue;
    const pick = arr[Math.floor(Math.random() * arr.length)];
    if (!ids.includes(pick.id)) ids.push(pick.id);
  }
  if (hasEcho) ids.push(ECHO_CARD.id);
  if (hasSibling) ids.push(siblingCard.id);
  return { cardIds: ids, hasEcho, hasSibling };
}

function blobPath(rng, cx, cy, r, points, variance) {
  const step = (Math.PI * 2) / points;
  const pts = [];
  for (let i = 0; i < points; i++) {
    const a = i * step;
    const rad = r * (1 - variance / 2 + rng() * variance);
    pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
  }
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} `;
  for (let i = 0; i < points; i++) {
    const p0 = pts[i], p1 = pts[(i + 1) % points];
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    d += `Q ${p0[0].toFixed(1)} ${p0[1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)} `;
  }
  return d + "Z";
}
function blobPathEllipse(rng, cx, cy, rx, ry, points, variance) {
  const step = (Math.PI * 2) / points;
  const pts = [];
  for (let i = 0; i < points; i++) {
    const a = i * step;
    const rad = 1 - variance / 2 + rng() * variance;
    pts.push([cx + Math.cos(a) * rx * rad, cy + Math.sin(a) * ry * rad]);
  }
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} `;
  for (let i = 0; i < points; i++) {
    const p0 = pts[i], p1 = pts[(i + 1) % points];
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    d += `Q ${p0[0].toFixed(1)} ${p0[1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)} `;
  }
  return d + "Z";
}
function starPath(cx, cy, r) {
  let d = "";
  for (let i = 0; i < 5; i++) {
    const a1 = (Math.PI / 5) * (2 * i) - Math.PI / 2;
    const a2 = (Math.PI / 5) * (2 * i + 1) - Math.PI / 2;
    const x1 = cx + Math.cos(a1) * r, y1 = cy + Math.sin(a1) * r;
    const x2 = cx + Math.cos(a2) * r * 0.45, y2 = cy + Math.sin(a2) * r * 0.45;
    d += (i === 0 ? "M" : "L") + `${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)} `;
  }
  return d + "Z";
}

        {tierIdx >= 4 && (
          <>
            <line x1={cx - bodyRx * 0.65} y1={bodyCy - bodyRy * 0.2} x2={cx - rWing * 1.8} y2={bodyCy - bodyRy * 0.35} stroke={light} strokeWidth="0.7" opacity="0.4" />
            <line x1={cx + bodyRx * 0.65} y1={bodyCy - bodyRy * 0.2} x2={cx + rWing * 1.8} y2={bodyCy - bodyRy * 0.35} stroke={light} strokeWidth="0.7" opacity="0.4" />
          </>
        )}
        <ellipse cx={cx - bodyRx * 0.55} cy={bodyCy + bodyRy * 0.75} rx={r * 0.15} ry={r * 0.22} fill={dark} />
        <ellipse cx={cx + bodyRx * 0.55} cy={bodyCy + bodyRy * 0.75} rx={r * 0.15} ry={r * 0.22} fill={dark} />
        <polygon points={`${cx - bodyRx * 0.6},${bodyCy + bodyRy * 0.95} ${cx - bodyRx * 0.5},${bodyCy + bodyRy * 0.8} ${cx - bodyRx * 0.4},${bodyCy + bodyRy * 0.95}`} fill={dark} />
        <polygon points={`${cx + bodyRx * 0.4},${bodyCy + bodyRy * 0.95} ${cx + bodyRx * 0.5},${bodyCy + bodyRy * 0.8} ${cx + bodyRx * 0.6},${bodyCy + bodyRy * 0.95}`} fill={dark} />

        <path d={body} fill={`url(#${gradId})`} stroke={dark} strokeWidth="2.5" />

        {patternType === "spots" && (
          <g clipPath={`url(#${clipId})`} opacity="0.3">
            {spots.map((s, i) => <ellipse key={i} cx={s.x} cy={s.y} rx={r * 0.06} ry={r * 0.05} fill={i % 2 === 0 ? dark : light} />)}
          </g>
        )}
        {patternType === "stripes" && (
          <g clipPath={`url(#${clipId})`} opacity="0.22">
            {stripes.map((s, i) => <line key={i} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke={dark} strokeWidth={r * 0.1} strokeLinecap="round" />)}
          </g>
        )}

        {[...Array(spineCount)].map((_, i) => {
          const yPos = bodyCy - bodyRy * 0.85 + i * ((bodyRy * 1.15) / Math.max(1, spineCount - 1));
          const spikeH = 5 + tierIdx * 0.35;
          return <polygon key={i} points={`${cx - 3},${yPos} ${cx},${yPos - spikeH} ${cx + 3},${yPos}`} fill={tierIdx >= 9 ? trimColor : light} opacity="0.75" />;
        })}
        <ellipse cx={cx} cy={bodyCy - bodyRy * 0.15} rx={bodyRx * 0.4} ry={bodyRy * 0.35} fill={light} opacity="0.35" />
        {showChestGem && (
          <>
            <circle cx={cx} cy={bodyCy - bodyRy * 0.05} r={r * 0.17} fill={light} opacity="0.25" />
            <circle cx={cx} cy={bodyCy - bodyRy * 0.05} r={r * 0.1} fill={tierIdx >= 9 ? "#fff3c4" : light} stroke={dark} strokeWidth="1" />
          </>
        )}

        <ellipse cx={cx} cy={cy - r * 0.85} rx={r * 0.42} ry={r * 0.38} fill={`url(#${gradId})`} stroke={dark} strokeWidth="2" />
        <ellipse cx={cx} cy={cy - r * 0.55} rx={r * 0.22} ry={r * 0.16} fill={`url(#${gradId})`} stroke={dark} strokeWidth="1.6" />

        {showCrest && (
          <polygon points={`${cx - 5},${cy - r * 1.25} ${cx},${cy - r * 1.85} ${cx + 5},${cy - r * 1.25}`} fill={trimColor} opacity="0.85" />
        )}
        {[...Array(hornPairs)].map((_, i) => (
          <React.Fragment key={i}>
            <path d={hornPath(-1, i)} fill="none" stroke={i === 0 ? dark : trimColor} strokeWidth={2.4 - i * 0.3} strokeLinecap="round" />
            <path d={hornPath(1, i)} fill="none" stroke={i === 0 ? dark : trimColor} strokeWidth={2.4 - i * 0.3} strokeLinecap="round" />
          </React.Fragment>
        ))}
        <path d={`M ${cx - r * 0.5} ${cy - r * 1.1} A ${r * 0.5} ${r * 0.5} 0 0 1 ${cx - r * 0.05} ${cy - r * 1.5}`} fill="none" stroke="#fff" strokeWidth="1.6" opacity="0.4" strokeLinecap="round" />

        <ellipse cx={cx - eyeGap} cy={eyeY} rx={eyeR} ry={eyeR * 1.1} fill="#241f2e" />
        <ellipse cx={cx + eyeGap} cy={eyeY} rx={eyeR} ry={eyeR * 1.1} fill="#241f2e" />
        <circle cx={cx - eyeGap - eyeR * 0.3} cy={eyeY - eyeR * 0.3} r={eyeR * 0.3} fill="#fff" />
        <circle cx={cx + eyeGap - eyeR * 0.3} cy={eyeY - eyeR * 0.3} r={eyeR * 0.3} fill="#fff" />
        <circle cx={cx - 3} cy={cy - r * 0.5} r="1" fill={dark} opacity="0.7" />
        <circle cx={cx + 3} cy={cy - r * 0.5} r="1" fill={dark} opacity="0.7" />
      </svg>
    );
  }

  let r = 24 + rng() * 6;
  if (card.isEvolution) r *= 1.18;
  const points = 10 + Math.floor(rng() * 3);
  const body = blobPath(rng, cx, cy, r, points, 0.24);
  const eyeGap = 7 + rng() * 4;
  const eyeY = cy - 4 + rng() * 4;
  const eyeR = 3.6 + rng() * 1.6;
  const bellyRy = r * (0.32 + rng() * 0.14);
  const tailSide = rng() < 0.5 ? -1 : 1;
  const browMood = rng();
  const mouthType = rng();
  const patternRoll = rng();
  const patternType = patternRoll < 0.32 ? "spots" : patternRoll < 0.58 ? "stripes" : "none";

  const tailBaseX = cx + tailSide * r * 0.5, tailBaseY = cy + r * 0.4;
  const tailTipX = cx + tailSide * r * 1.6, tailTipY = cy - r * 0.05;
  const tailPath = `M ${tailBaseX} ${tailBaseY} Q ${cx + tailSide * r * 1.35} ${cy + r * 0.2} ${tailTipX} ${tailTipY} Q ${cx + tailSide * r * 1.1} ${cy + r * 0.35} ${tailBaseX + tailSide * r * 0.1} ${tailBaseY + r * 0.12} Z`;

  const spots = [];
  for (let i = 0; i < 5; i++) {
    spots.push({
      x: cx + (rng() - 0.5) * r * 1.3, y: cy + (rng() - 0.5) * r * 1.1,
      rx: r * (0.07 + rng() * 0.06), ry: r * (0.06 + rng() * 0.05),
    });
  }
  const stripes = [];
  for (let i = 0; i < 4; i++) {
    const yOff = cy - r * 0.7 + i * (r * 0.45);
    stripes.push({ x1: cx - r * 0.95, y1: yOff, x2: cx + r * 0.95, y2: yOff + r * 0.3 });
  }

  const browY = eyeY - eyeR * 1.9;
  const browArc = browMood < 0.34 ? -1 : browMood < 0.67 ? 0 : 1; // raised / flat / angled

  return (
    <svg viewBox="0 0 100 100" className="creature-svg">
      <defs>
        <radialGradient id={gradId} cx="34%" cy="28%" r="80%">
          <stop offset="0%" stopColor={light} />
          <stop offset="55%" stopColor={color} />
          <stop offset="100%" stopColor={dark} />
        </radialGradient>
        <clipPath id={clipId}><path d={body} /></clipPath>
      </defs>

      <ellipse cx={cx} cy={cy + r * 0.95} rx={r * 0.82} ry={r * 0.16} fill="#000" opacity="0.3" />
      {card.isEvolution && (
        <>
          <ellipse cx={cx} cy={cy - r * 0.05} rx={r * 1.55} ry={r * 1.55} fill="none" stroke={light} strokeWidth="0.7" opacity="0.35" />
          <ellipse cx={cx} cy={cy - r * 0.05} rx={r * 1.3} ry={r * 1.3} fill="none" stroke={light} strokeWidth="0.5" opacity="0.28" />
        </>
      )}
      <path d={tailPath} fill={dark} opacity="0.92" />
      <circle cx={tailTipX} cy={tailTipY} r={r * 0.11} fill={light} opacity="0.8" />
      <ellipse cx={cx - r * 0.4} cy={cy + r * 0.72} rx={r * 0.22} ry={r * 0.15} fill={dark} />
      <ellipse cx={cx + r * 0.4} cy={cy + r * 0.72} rx={r * 0.22} ry={r * 0.15} fill={dark} />

      <path d={body} fill={`url(#${gradId})`} stroke={dark} strokeWidth="2.5" />

      {patternType === "spots" && (
        <g clipPath={`url(#${clipId})`} opacity="0.32">
          {spots.map((s, i) => <ellipse key={i} cx={s.x} cy={s.y} rx={s.rx} ry={s.ry} fill={i % 2 === 0 ? dark : light} />)}
        </g>
      )}
      {patternType === "stripes" && (
        <g clipPath={`url(#${clipId})`} opacity="0.24">
          {stripes.map((s, i) => <line key={i} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke={dark} strokeWidth={r * 0.13} strokeLinecap="round" />)}
        </g>
      )}

      <ellipse cx={cx} cy={cy + r * 0.32} rx={r * 0.48} ry={bellyRy} fill={light} opacity="0.4" />

      <ellipse cx={cx - r * 0.95} cy={cy - r * 0.02} rx={r * 0.19} ry={r * 0.34} fill={`url(#${gradId})`} stroke={dark} strokeWidth="1.4" transform={`rotate(-18 ${cx - r * 0.95} ${cy - r * 0.02})`} />
      <ellipse cx={cx + r * 0.95} cy={cy - r * 0.02} rx={r * 0.19} ry={r * 0.34} fill={`url(#${gradId})`} stroke={dark} strokeWidth="1.4" transform={`rotate(18 ${cx + r * 0.95} ${cy - r * 0.02})`} />
      <circle cx={cx - r * 1.08} cy={cy + r * 0.28} r={r * 0.13} fill={dark} opacity="0.9" />
      <circle cx={cx + r * 1.08} cy={cy + r * 0.28} r={r * 0.13} fill={dark} opacity="0.9" />

      <TypeAccessory typeId={card.type} cx={cx} cy={cy} r={r} dark={dark} />

      <path
        d={`M ${cx - r * 0.72} ${cy - r * 0.3} A ${r} ${r} 0 0 1 ${cx - r * 0.08} ${cy - r * 0.98}`}
        fill="none" stroke="#fff" strokeWidth="2" opacity="0.4" strokeLinecap="round"
      />
      <ellipse cx={cx - r * 0.4} cy={cy - r * 0.45} rx={r * 0.32} ry={r * 0.22} fill="#fff" opacity="0.16" />

      <ellipse cx={cx - eyeGap - eyeR * 0.1} cy={eyeY + eyeR * 1.5} rx={eyeR * 0.85} ry={eyeR * 0.5} fill="#ff8fa3" opacity="0.3" />
      <ellipse cx={cx + eyeGap - eyeR * 0.1} cy={eyeY + eyeR * 1.5} rx={eyeR * 0.85} ry={eyeR * 0.5} fill="#ff8fa3" opacity="0.3" />

      <path d={`M ${cx - eyeGap - eyeR} ${browY + browArc * 1.5} Q ${cx - eyeGap} ${browY - browArc * 1.5} ${cx - eyeGap + eyeR} ${browY + browArc * 0.5}`} fill="none" stroke={dark} strokeWidth="1.7" strokeLinecap="round" />
      <path d={`M ${cx + eyeGap - eyeR} ${browY + browArc * 0.5} Q ${cx + eyeGap} ${browY - browArc * 1.5} ${cx + eyeGap + eyeR} ${browY + browArc * 1.5}`} fill="none" stroke={dark} strokeWidth="1.7" strokeLinecap="round" />

      <ellipse cx={cx - eyeGap} cy={eyeY} rx={eyeR} ry={eyeR * 1.15} fill="#241f2e" />
      <ellipse cx={cx + eyeGap} cy={eyeY} rx={eyeR} ry={eyeR * 1.15} fill="#241f2e" />
      <circle cx={cx - eyeGap - eyeR * 0.3} cy={eyeY - eyeR * 0.35} r={eyeR * 0.32} fill="#fff" />
      <circle cx={cx + eyeGap - eyeR * 0.3} cy={eyeY - eyeR * 0.35} r={eyeR * 0.32} fill="#fff" />

      {mouthType < 0.55 ? (
        <path d={`M ${cx - 4} ${eyeY + eyeR * 2.1} Q ${cx} ${eyeY + eyeR * 2.1 + 3.5} ${cx + 4} ${eyeY + eyeR * 2.1}`} fill="none" stroke={dark} strokeWidth="1.6" strokeLinecap="round" />
      ) : (
        <ellipse cx={cx} cy={eyeY + eyeR * 2.3} rx="2.1" ry="2.6" fill={dark} opacity="0.85" />
      )}
    </svg>
  );
}

function pips(tier) {
  const def = TIER_MAP[tier];
  return def.symbol.repeat(def.pips);
}

const SPARKLE_POS = [
  { top: "8%", left: "14%", delay: 0, color: "#fff" },
  { top: "18%", left: "82%", delay: 0.4, color: "#ffd23f" },
  { top: "42%", left: "4%", delay: 0.9, color: "#29e6d6" },

];

function Card({ card, count = 0, owned = true, size = "normal", isNew = false, level }) {
  const ref = useRef(null);
  const allLevels = useContext(LevelsContext);
  const [tilt, setTilt] = useState({ x: 0, y: 0 });
  const ambientEchoType = useContext(EchoTypeContext);
  const reduceMotion = useMemo(
    () => typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches,
    []
  );
  const card2 = card.tier === "echo" ? { ...card, echoType: ambientEchoType } : card;
  const def = TIER_MAP[card2.tier];
  const isHandler = card2.category === "handler";
  const typeColor = colorForCard(card2);
  const dark = shade(typeColor, -70);

  const onMove = useCallback((e) => {
    if (reduceMotion || !ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;
    const py = (e.clientY - rect.top) / rect.height;
    setTilt({ x: (py - 0.5) * -14, y: (px - 0.5) * 14 });
  }, [reduceMotion]);
  const onLeave = useCallback(() => setTilt({ x: 0, y: 0 }), []);

  if (!owned) {
    return (
      <div className={`card card-locked card-${size}`}>
        <div className="locked-mark">?</div>
        <div className="locked-label">{def.label}</div>
      </div>
    );
  }

  const frontStyle = {
    background: `linear-gradient(155deg, ${shade(typeColor, 20)} 0%, ${typeColor} 45%, ${dark} 100%)`,
    transform: `perspective(700px) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg)`,
  };

  return (
    <div
      ref={ref}
      className={`card card-${size} card-group-${def.group} ${card.prism ? "card-prismfx" : ""}`}
      style={frontStyle}
      onMouseMove={onMove}
      onMouseLeave={onLeave}
    >
      {(def.group === "star" || def.group === "prism" || def.group === "gilded" || def.group === "champion" || def.group === "echo" || def.group === "siblings") && <div className="card-shimmer" />}
      {(def.group === "prism" || def.group === "champion" || def.group === "echo" || def.group === "siblings") && <div className="card-holo" />}
      {(def.group === "prism" || def.group === "gilded" || def.group === "champion" || def.group === "echo" || def.group === "siblings") && (
        <div className="card-sparkles">
          {SPARKLE_POS.map((p, i) => (
            <span key={i} style={{ top: p.top, left: p.left, animationDelay: `${p.delay}s`, color: p.color }}>✦</span>
          ))}
        </div>
      )}
      {isNew && <div className="card-new-flag">NEW</div>}
      {card.isEvolution && <div className="card-evo-flag">EVOLVED</div>}
      {count > 1 && <div className="card-count">×{count}</div>}
      <div className="card-top">
        <span className="card-tier-pips">{pips(card.tier)}</span>
        <span className="card-type-icon">{def.group === "echo" ? (card2.echoType ? TYPE_MAP[card2.echoType].icon : "❂") : isHandler ? "🧭" : TYPE_MAP[card2.type].icon}</span>
      </div>
      <div className="card-art">
        {(def.group === "star" || def.group === "prism" || def.group === "gilded" || def.group === "champion" || def.group === "echo" || def.group === "siblings") && <div className="card-rays" />}
        <CreatureArt card={card2} />
      </div>
      <div className="card-body">
        <div className="card-name">{card.name}</div>
        <div className="card-sub">
          {isHandler ? "Field Handler" : `HP ${card.hp}`}
          {canLevel(card) && owned ? ` · Lv ${level != null ? level : ((allLevels[card.id] && allLevels[card.id].level) || 1)}` : ""}
        </div>
        {card.isEvolution && <div className="card-evo-sub">Evolved from {card.evolvesFromName}</div>}
      </div>
      <div className="card-tier-label">{def.label}</div>
    </div>
  );
}

function CardBack({ size = "normal", onClick }) {
  return (
    <div className={`card card-${size} card-back`} onClick={onClick}>
      <div className="card-back-emblem">EW</div>
    </div>
  );
}

    packsOpened, battleWins, echoType,
    coins: coinsRef.current,
    cardMoves: movesRef.current,
    cardLoadout: loadoutRef.current,
    luckExpiresAt: luckRef.current,
    cardLevels: levelsRef.current,
    arenaLevel: arenaRef.current,
    ...over,
  });

  const manualSave = async () => {
    setSaveStatus("saving");
    await persist({});
    setSaveStatus("saved");
    setTimeout(() => setSaveStatus("idle"), 2000);
  };

  const setEchoForm = (typeId) => {
    setEchoType(typeId);
    persist({ echoType: typeId });
  };

  const openPack = (deckType = "standard") => {
    const premium = deckType === "premium";
    const genesis = deckType === "genesis";
    if (premium && coinsRef.current < PREMIUM_PACK_COST) return;
    setPackShake(true);
    setTimeout(() => {
      const prev = collectionRef.current;
      const luckActive = Date.now() < luckRef.current;
      const result = genesis ? rollGenesisPack(genesisPool, luckActive) : rollPack(basePool, premium, luckActive);
      const sorted = [...result.cards].sort((a, b) => TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));
      const seen = new Set();
      const isNew = sorted.map((c) => {
        const n = !(prev[c.id] > 0) && !seen.has(c.id);
        seen.add(c.id);
        return n;
      });
      const nextCollection = { ...prev };
      sorted.forEach((c) => { nextCollection[c.id] = (nextCollection[c.id] || 0) + 1; });
      const nextPacksOpened = packsOpened + 1;
      const nextCoins = coinsRef.current - (premium ? PREMIUM_PACK_COST : 0);
      collectionRef.current = nextCollection;
      coinsRef.current = nextCoins;
      setCollection(nextCollection);
      setPacksOpened(nextPacksOpened);
      setCoins(nextCoins);
      persist({ collection: nextCollection, packsOpened: nextPacksOpened, coins: nextCoins });
      setSpotlight(null);
      setCutscene(null);
      setPack({ cards: sorted, isGodPack: result.isGodPack, isNew, deckType, phase: "sequence", index: 0, flipped: false });
      setScreen("opening");
      setPackShake(false);
    }, 550);
  };

  const stopAutoOpen = (reason = "") => {
    if (autoIntervalRef.current) { clearInterval(autoIntervalRef.current); autoIntervalRef.current = null; }
    setAutoRunning(false);
    if (reason) setAutoStopReason(reason);
    setAutoBestCards(autoStatsRef.current.bestCards.slice());
  };

  const autoOpenTick = (deckType) => {
    const premium = deckType === "premium";
    const genesis = deckType === "genesis";
    if (premium && coinsRef.current < PREMIUM_PACK_COST) {
      stopAutoOpen("Stopped — not enough coins for another Prismatic pack.");
      return;
    }
    const luckActive = Date.now() < luckRef.current;
    const result = genesis ? rollGenesisPack(genesisPool, luckActive) : rollPack(basePool, premium, luckActive);
    const next = { ...collectionRef.current };
    result.cards.forEach((c) => { next[c.id] = (next[c.id] || 0) + 1; });
    const nextCoins = coinsRef.current - (premium ? PREMIUM_PACK_COST : 0);
    collectionRef.current = next;
    coinsRef.current = nextCoins;
    autoStatsRef.current.opened += 1;
    const nextPacksOpened = autoStatsRef.current.startPacks + autoStatsRef.current.opened;
    const bestOfPack = result.cards.reduce(
      (best, c) => (TIER_ORDER.indexOf(c.tier) > TIER_ORDER.indexOf(best.tier) ? c : best),
      result.cards[0]
    );
    if (autoStatsRef.current.bestCards.length < AUTO_BEST_CAP) autoStatsRef.current.bestCards.push(bestOfPack);

    setCollection(next);
    setCoins(nextCoins);
    setPacksOpened(nextPacksOpened);
    setAutoOpened(autoStatsRef.current.opened);
    setAutoLastCard(bestOfPack);
    persist({ collection: next, packsOpened: nextPacksOpened, coins: nextCoins });
  };

  const startAutoOpen = (deckType) => {
    if (autoRunning) return;
    if (deckType === "premium" && coinsRef.current < PREMIUM_PACK_COST) { setAutoStopReason("Not enough coins to start."); return; }
    autoStatsRef.current = { startPacks: packsOpened, opened: 0, bestCards: [] };
    setAutoOpened(0);
    setAutoLastCard(null);
    setAutoStopReason("");
    setAutoBestCards([]);
    setAutoRunning(true);
    autoIntervalRef.current = setInterval(() => autoOpenTick(deckType), AUTO_OPEN_MS);
  };

  useEffect(() => () => { if (autoIntervalRef.current) clearInterval(autoIntervalRef.current); }, []);

  const flipCurrent = () => {
    if (!pack || pack.flipped || cutscene) return;
    const card = pack.cards[pack.index];
    if (CUTSCENE_TIERS.includes(card.tier)) {
      setCutscene({ card });
      setTimeout(() => {
        setCutscene(null);
        setSpotlight(colorForCard(card.tier === "echo" ? { ...card, echoType } : card));
        setPack((p) => (p ? { ...p, flipped: true } : p));
      }, 8000);
    } else {
      setSpotlight(isRareOrBetter(card) ? colorForCard(card) : null);
      setPack({ ...pack, flipped: true });
    }
  };
  const nextCard = () => {
    if (!pack) return;
    if (pack.index < pack.cards.length - 1) {
      setSpotlight(null);
      setPack({ ...pack, index: pack.index + 1, flipped: false });
    } else {
      setSpotlight(null);
      setPack({ ...pack, phase: "lineup" });
    }
  };
  const skipToLineup = () => {
    setSpotlight(null);
    setCutscene(null);
    setPack((p) => (p ? { ...p, phase: "lineup", flipped: true, index: p.cards.length - 1 } : p));
  };
  const closePack = () => { setSpotlight(null); setCutscene(null); setPack(null); setScreen("home"); };

  /* ---------- Battle ---------- */
  const ownedCreatures = pool
    .filter((c) => c.category === "creature" && collection[c.id] > 0)
    .sort((a, b) => TIER_ORDER.indexOf(b.tier) - TIER_ORDER.indexOf(a.tier))
    .slice(0, 150);

  const toggleTeamCard = (id) => {
    setSelectedTeamIds((prev) => {
      if (prev.includes(id)) return prev.filter((x) => x !== id);
      if (prev.length >= 3) return prev;
      return [...prev, id];
    });
  };

  const startBattle = () => {
    const playerCards = selectedTeamIds.map((id) => pool.find((c) => c.id === id)).filter(Boolean);
    if (playerCards.length < 3) return;
    const aiCards = pickAiTeam(playerCards, pool);
    const enemyLevel = Math.max(1, Math.min(MAX_LEVEL, Math.round(arenaRef.current)));
    const hasBothSiblings = (collectionRef.current[NEON_CARD.id] > 0) && (collectionRef.current[DROGEN_CARD.id] > 0);
    const mk = (c, withBought, level) => {
      const boost = c.tier === "siblings" && hasBothSiblings ? SIBLING_BATTLE_BOOST : 1;
      const maxHp = Math.round(battleMaxHp(c, level) * boost);
      return {
        card: c, level: canLevel(c) ? level : null,
        hp: maxHp, maxHp, atk: Math.round(battleAtk(c, level) * boost),
        moves: withBought ? equippedFor(c) : genMoves(c),
      };
    };
    const levelOf = (c) => (levelsRef.current[c.id] && levelsRef.current[c.id].level) || 1;
    setBattle({
      playerTeam: playerCards.map((c) => mk(c, true, levelOf(c))),
      aiTeam: aiCards.map((c) => mk(c, false, enemyLevel)),
      enemyLevel,
      expGains: {},
      pIdx: 0, aIdx: 0,
      log: hasBothSiblings && playerCards.some((c) => c.tier === "siblings")
        ? [`The sibling bond surges! Opponent team: Lv.${enemyLevel}`]
        : [`An opposing trainer (all cards Lv.${enemyLevel}) challenges you!`],
      status: "ongoing",
      reward: null,
    });
    setBattlePhase("fight");
  };

  const playerAttack = (move) => {
    setBattle((prev) => {
      if (!prev || prev.status !== "ongoing") return prev;
      const attacker = prev.playerTeam[prev.pIdx];
      const chosen = move || attacker.moves[0];
      let aiTeam = [...prev.aiTeam];
      let defender = { ...aiTeam[prev.aIdx] };
      const mult = typeMultiplier(chosen.type, defender.card.type);
      const dmg = Math.max(3, Math.round(attacker.atk * (chosen.power / 80) * (0.85 + Math.random() * 0.3) * mult));
      defender.hp = Math.max(0, defender.hp - dmg);
      aiTeam[prev.aIdx] = defender;
      const eff = mult > 1 ? " — super effective!" : mult < 1 ? " — not very effective." : "";
      const log = [...prev.log, `${attacker.card.name} used ${chosen.name} on ${defender.card.name} for ${dmg}${eff}`];

      let aIdx = prev.aIdx, status = "ongoing";
      let expGains = prev.expGains || {};
      if (defender.hp <= 0) {
        const gain = expYield(defender.card, prev.enemyLevel || 1);
        // The card that lands the blow earns the EXP. Gods can't level, so their EXP is shared by teammates who can.
        const recipients = canLevel(attacker.card)
          ? [attacker.card.id]
          : prev.playerTeam.filter((m) => canLevel(m.card)).map((m) => m.card.id);
        if (recipients.length) {
          const share = Math.max(1, Math.round(gain / recipients.length));
          expGains = { ...expGains };
          recipients.forEach((id) => { expGains[id] = (expGains[id] || 0) + share; });
        }
        log.push(`${defender.card.name} is knocked out!${recipients.length ? ` (+${gain} EXP)` : ""}`);
        const nextIdx = aiTeam.findIndex((m, i) => i !== prev.aIdx && m.hp > 0);
        if (nextIdx === -1) status = "won"; else aIdx = nextIdx;
      }

      let playerTeam = prev.playerTeam, pIdx = prev.pIdx;
      if (status === "ongoing") {
        const aiAttacker = aiTeam[aIdx];
        let pDefender = { ...playerTeam[pIdx] };
        // AI picks whichever of its moves would hit hardest
        const aiMove = aiAttacker.moves.reduce((best, m) => {
          const score = m.power * typeMultiplier(m.type, pDefender.card.type);
          const bestScore = best.power * typeMultiplier(best.type, pDefender.card.type);
          return score > bestScore ? m : best;
        }, aiAttacker.moves[0]);
        const mult2 = typeMultiplier(aiMove.type, pDefender.card.type);
        const dmg2 = Math.max(3, Math.round(aiAttacker.atk * (aiMove.power / 80) * (0.85 + Math.random() * 0.3) * mult2));
        pDefender.hp = Math.max(0, pDefender.hp - dmg2);
        playerTeam = [...playerTeam];
        playerTeam[pIdx] = pDefender;
        const eff2 = mult2 > 1 ? " — super effective!" : mult2 < 1 ? " — not very effective." : "";
        log.push(`${aiAttacker.card.name} used ${aiMove.name} on ${pDefender.card.name} for ${dmg2}${eff2}`);
        if (pDefender.hp <= 0) {
          log.push(`${pDefender.card.name} is knocked out!`);
          const nextP = playerTeam.findIndex((m, i) => i !== pIdx && m.hp > 0);
          if (nextP === -1) status = "lost"; else pIdx = nextP;
        }
      }
      return { ...prev, aiTeam, playerTeam, aIdx, pIdx, expGains, log: log.slice(-6), status };
    });
  };

  // Runs once when a battle ends: banks EXP, moves the arena level, and hands out rewards.
  useEffect(() => {
    if (!battle || battle.status === "ongoing" || battle.settled) return;
    const won = battle.status === "won";

    // 1) EXP and level-ups (EXP counts even if the battle was lost)
    const nextLevels = { ...levelsRef.current };
    const levelUps = [];
    Object.entries(battle.expGains || {}).forEach(([id, amt]) => {
      const card = pool.find((c) => c.id === id);
      if (!card || !canLevel(card)) return;
      const st = { ...(nextLevels[id] || { level: 1, exp: 0 }) };
      const from = st.level;
      st.exp += amt;
      while (st.level < MAX_LEVEL && st.exp >= expToNext(st.level)) { st.exp -= expToNext(st.level); st.level += 1; }
      if (st.level >= MAX_LEVEL) st.exp = 0;
      nextLevels[id] = st;
      if (st.level > from) levelUps.push({ id, name: card.name, from, to: st.level });
    });

    // 2) The arena only gets harder when you win: next opponent is 1.75x the level of this one
    const nextArena = won ? Math.min(MAX_LEVEL, arenaRef.current * ARENA_GROWTH) : arenaRef.current;

    // 3) Rewards — capture one opposing card (10% chance it becomes a Champion)
    let reward = null, isChampionRoll = false, isNewReward = false;
    let nextCollection = collectionRef.current, nextWins = battleWins;
    if (won) {
      const captured = battle.aiTeam[Math.floor(Math.random() * battle.aiTeam.length)].card;
      isChampionRoll = Math.random() < CHAMPION_CAPTURE_CHANCE;
      reward = captured;
      if (isChampionRoll) {
        const championPool = pool.filter((c) => c.tier === "champion");
        reward = championPool[Math.floor(Math.random() * championPool.length)];
      }
      isNewReward = !(collectionRef.current[reward.id] > 0);
      nextCollection = { ...collectionRef.current, [reward.id]: (collectionRef.current[reward.id] || 0) + 1 };
      nextWins = battleWins + 1;
    }
    // Beating a full Lv.100 team earns the pick of ANY card in the game
    const grandPrize = won && battle.enemyLevel >= MAX_LEVEL;

    levelsRef.current = nextLevels;
    arenaRef.current = nextArena;
    collectionRef.current = nextCollection;
    setCardLevels(nextLevels);
    setArenaLevel(nextArena);
    setCollection(nextCollection);
    if (won) setBattleWins(nextWins);
    persist({ cardLevels: nextLevels, arenaLevel: nextArena, collection: nextCollection, battleWins: nextWins });

    setBattle((p) => (p ? {
      ...p, settled: true, levelUps, grandPrize, prizeCard: null,
      nextArena: Math.min(MAX_LEVEL, Math.round(nextArena)),
      reward: reward ? { ...reward, isNew: isNewReward, isChampionCapture: isChampionRoll } : null,
    } : p));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [battle && battle.status]);

  /* Level 100 grand prize: pick any card in the game */
  const [prizeSearch, setPrizeSearch] = useState("");
  const [prizeTier, setPrizeTier] = useState("all");
  const [prizeType, setPrizeType] = useState("all");
  const [prizeDeck, setPrizeDeck] = useState("all");
  const [prizePick, setPrizePick] = useState(null);
  const [prizeVisible, setPrizeVisible] = useState(60);
  const claimPrize = () => {
    if (!prizePick || !battle || !battle.grandPrize || battle.prizeCard) return;
    const next = { ...collectionRef.current, [prizePick.id]: (collectionRef.current[prizePick.id] || 0) + 1 };
    collectionRef.current = next;
    setCollection(next);
    persist({ collection: next });
    setBattle((p) => (p ? { ...p, prizeCard: prizePick } : p));
    setPrizePick(null);
  };

  const resetBattle = () => {
    setBattle(null); setSelectedTeamIds([]); setBattlePhase("select");
    setPrizePick(null); setPrizeSearch(""); setPrizeTier("all"); setPrizeType("all"); setPrizeDeck("all"); setPrizeVisible(60);
  };

  /* ---------- Economy ---------- */
  const sellCard = (card) => {
    const owned = collectionRef.current[card.id] || 0;
    if (owned <= 0) return;
    const next = { ...collectionRef.current };
    next[card.id] = owned - 1;
    if (next[card.id] <= 0) delete next[card.id];
    const gain = cardValue(card);
    const nextCoins = coinsRef.current + gain;
    collectionRef.current = next;
    coinsRef.current = nextCoins;
    setCollection(next);
    setCoins(nextCoins);
    persist({ collection: next, coins: nextCoins });
    if (!next[card.id]) setDetailCard(null);
  };

  const sellAllOfCard = (card) => {
    const owned = collectionRef.current[card.id] || 0;
    if (owned <= 1) return;
    const next = { ...collectionRef.current };
    next[card.id] = 1;
    const gain = cardValue(card) * (owned - 1);
    const nextCoins = coinsRef.current + gain;
    collectionRef.current = next;
    coinsRef.current = nextCoins;
    setCollection(next);
    setCoins(nextCoins);
    persist({ collection: next, coins: nextCoins });
  };

  const sellByRarity = (tierId) => {
    if (GOD_TIERS.includes(tierId) || !TIER_MAP[tierId]) return;
    const targets = pool.filter((c) => c.tier === tierId && (collectionRef.current[c.id] || 0) > 1);
    if (targets.length === 0) { setAutoSellNote(`No duplicate ${TIER_MAP[tierId].label} cards to sell.`); return; }
    const next = { ...collectionRef.current };
    let gain = 0;
    targets.forEach((c) => {
      const n = next[c.id] || 0;
      gain += cardValue(c) * (n - 1);
      next[c.id] = 1;
    });
    const nextCoins = coinsRef.current + gain;
    collectionRef.current = next;
    coinsRef.current = nextCoins;
    setCollection(next);
    setCoins(nextCoins);
    persist({ collection: next, coins: nextCoins });
    setAutoSellNote(`Sold duplicates of ${targets.length} ${TIER_MAP[tierId].label} card${targets.length === 1 ? "" : "s"} (kept one each) for ◈ ${fmtValue(gain)}.`);
  };

  const buyLuckBoost = (opt) => {
    if (coinsRef.current < opt.cost) { setShopNote("Not enough coins"); return; }
    const base = Math.max(luckRef.current, Date.now());
    const nextExpiry = base + opt.ms;
    const nextCoins = coinsRef.current - opt.cost;
    luckRef.current = nextExpiry;
    coinsRef.current = nextCoins;
    setLuckExpiresAt(nextExpiry);
    setCoins(nextCoins);
    persist({ luckExpiresAt: nextExpiry, coins: nextCoins });
    setShopNote(`Luck Boost active! Rare+ odds are ×${LUCK_MULT} for ${opt.label}.`);
  };

  // The moves a card currently has equipped (what it actually uses in battle)
  const equippedFor = (card) => equippedOf(card, movesRef.current[card.id], loadoutRef.current[card.id]);
  const saveLoadout = (card, ids) => {
    const next = { ...loadoutRef.current, [card.id]: ids };
    loadoutRef.current = next;
    setCardLoadout(next);
    persist({ cardLoadout: next });
  };

  const buyMove = (card, move) => {
    const learned = movesRef.current[card.id] || [];
    const check = canLearnMove(card, move, learned);
    if (!check.ok) { setShopNote(check.why); return; }
    if (coinsRef.current < move.cost) { setShopNote("Not enough coins"); return; }
    const before = equippedFor(card).map((m) => m.id); // lock in the current loadout so nothing changes silently
    const nextMoves = { ...movesRef.current, [card.id]: [...learned, move] };
    const nextCoins = coinsRef.current - move.cost;
    const slots = moveSlotsFor(card);
    const equipNow = before.length < slots;
    const nextLoadout = { ...loadoutRef.current, [card.id]: equipNow ? [...before, move.id] : before };
    movesRef.current = nextMoves;
    coinsRef.current = nextCoins;
    loadoutRef.current = nextLoadout;
    setCardMoves(nextMoves);
    setCardLoadout(nextLoadout);
    setCoins(nextCoins);
    persist({ cardMoves: nextMoves, cardLoadout: nextLoadout, coins: nextCoins });
    setShopNote(`${card.name} learned ${move.name}${equipNow ? " and equipped it!" : ` — all ${slots} slots are full, swap it in below.`}`);
  };

  const equipMove = (card, moveId, replaceId) => {
    const cur = equippedFor(card).map((m) => m.id);
    if (cur.includes(moveId)) return;
    const slots = moveSlotsFor(card);
    if (cur.length < slots) { saveLoadout(card, [...cur, moveId]); setSwapInId(null); setShopNote("Move equipped."); return; }
    if (!replaceId || !cur.includes(replaceId)) {
      setSwapInId(moveId);
      setShopNote(`All ${slots} slots are full — pick an equipped move to replace.`);
      return;
    }
    saveLoadout(card, cur.map((id) => (id === replaceId ? moveId : id)));
    setSwapInId(null);
    setShopNote("Moves swapped!");
  };
  const unequipMove = (card, moveId) => {
    const cur = equippedFor(card).map((m) => m.id);
    if (cur.length <= 1) { setShopNote("A card needs at least one equipped move."); return; }
    saveLoadout(card, cur.filter((id) => id !== moveId));
  };

  /* ---------- Trader lifecycle ---------- */

  // Restore trader state on load (so the timer survives a refresh)
  useEffect(() => {
    const saved = loadTrader();
    const now = Date.now();
    if (saved && saved.trader && saved.trader.expiresAt > now) {
      setTrader(saved.trader);
      setNextTraderAt(saved.nextTraderAt || saved.trader.expiresAt + TRADER_GAP_MS);
    } else if (saved && saved.nextTraderAt) {
      setNextTraderAt(saved.nextTraderAt);
    } else {
      setNextTraderAt(now); // first-ever load: trader arrives right away
    }
  }, []);

  // 1s clock so countdowns tick
  useEffect(() => {
    const t = setInterval(() => setClockNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // Spawn / expire the trader as the clock advances
  useEffect(() => {
    if (!loaded || !nextTraderAt) return;
    const now = clockNow;
    if (trader) {
      if (now >= trader.expiresAt) {
        const nAt = now + TRADER_GAP_MS;
        setTrader(null);
        setNextTraderAt(nAt);
        setTradeTargetId(null);
        setOffer({});
        saveTrader({ trader: null, nextTraderAt: nAt });
      }
    } else if (now >= nextTraderAt) {
      const stock = rollTraderStock(pool);
      const t = { ...stock, expiresAt: now + TRADER_VISIT_MS };
      setTrader(t);
      saveTrader({ trader: t, nextTraderAt: t.expiresAt + TRADER_GAP_MS });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [clockNow, loaded, nextTraderAt, trader]);

  const tradeTarget = tradeTargetId ? pool.find((c) => c.id === tradeTargetId) : null;
  const offerValue = Object.entries(offer).reduce((sum, [id, qty]) => {
    const c = pool.find((x) => x.id === id);
    return sum + (c ? cardValue(c) * qty : 0);
  }, 0);

  // Cards you own and could offer (never the card you're trying to get)
  const tradableOwned = pool
    .filter((c) => collection[c.id] > 0 && !GOD_TIERS.includes(c.tier) && c.id !== tradeTargetId)
    .sort((a, b) => cardValue(a) - cardValue(b));

  const [offerVisible, setOfferVisible] = useState(120);
  const [offerCoins, setOfferCoins] = useState(0); // coins added to a card offer
  const isGodTarget = !!tradeTarget && GOD_TIERS.includes(tradeTarget.tier);
  const coinsOffered = isGodTarget ? 0 : Math.max(0, Math.min(coins, Math.floor(offerCoins) || 0));
  const tradeCheck = tradeTarget && tradeTarget.tier !== "echo" ? evaluateTrade(tradeTarget, offerValue, coinsOffered) : null;
  const selectTradeTarget = (id) => {
    setTradeTargetId(id === tradeTargetId ? null : id);
    setOffer({});
    setOfferCoins(0);
  };
  // Tops the offer up with just enough coins for the cheapest option that still works
  const fillCoins = () => {
    if (!tradeTarget || isGodTarget) return;
    const v = cardValue(tradeTarget);
    if (offerValue >= v) { setOfferCoins(0); return; }
    const need = offerValue > 0 ? v * TRADER_MIXED_MULT - offerValue : v * TRADER_COIN_ONLY_MULT;
    setOfferCoins(Math.max(0, Math.min(coins, need)));
  };
  const addToOffer = (id) => {
    setOffer((prev) => {
      const owned = collection[id] || 0;
      const cur = prev[id] || 0;
      if (cur >= owned) return prev;
      return { ...prev, [id]: cur + 1 };
    });
  };
  const removeFromOffer = (id) => {
    setOffer((prev) => {
      const cur = prev[id] || 0;
      if (cur <= 1) { const n = { ...prev }; delete n[id]; return n; }
      return { ...prev, [id]: cur - 1 };
    });
  };

  /* Echo's trade gate: own every non-Champion card in the original deck, plus at least 5 Champions */
  const echoEligibility = useMemo(() => {
    const missing = basePool.filter(
      (c) => c.tier !== "echo" && c.tier !== "champion" && !(collection[c.id] > 0)
    );
    const championCount = basePool
      .filter((c) => c.tier === "champion")
      .reduce((s, c) => s + (collection[c.id] || 0), 0);
    const gildedCards = basePool.filter((c) => c.tier === "gilded");
    const gildedReady = gildedCards.every((c) => (collection[c.id] || 0) >= ECHO_COST.gildedEach);
    const psCount = basePool
      .filter((c) => c.tier === "prismSignature")
      .reduce((s, c) => s + (collection[c.id] || 0), 0);
    return {
      missingCount: missing.length,
      championCount,
      gildedReady,
      psCount,
      canTrade:
        missing.length === 0 &&
        championCount >= ECHO_COST.champion &&
        gildedReady &&
        psCount >= ECHO_COST.prismSignature,
    };
  }, [collection, basePool]);

  /* Genesis trade gate: own every Genesis card, but only need 5 of the 24 Champions */
  const siblingEligibility = useMemo(() => {
    const missing = genesisPool.filter(
      (c) => c.tier !== "siblings" && c.tier !== "champion" && !(collection[c.id] > 0)
    );
    const championCount = genesisPool
      .filter((c) => c.tier === "champion")
      .reduce((s, c) => s + (collection[c.id] || 0), 0);
    return {
      missingCount: missing.length,
      championCount,
      canTrade: missing.length === 0 && championCount >= 5,
    };
  }, [collection, genesisPool]);

  const buyWithCoins = () => {
    if (!tradeTarget || !trader) return;
    if (GOD_TIERS.includes(tradeTarget.tier)) return; // Echo, Neon & Drogen can't be bought with coins
    const cost = cardValue(tradeTarget) * TRADER_COIN_ONLY_MULT;
    if (coinsRef.current < cost) return;
    const nextCoins = coinsRef.current - cost;
    const next = { ...collectionRef.current, [tradeTarget.id]: (collectionRef.current[tradeTarget.id] || 0) + 1 };
    coinsRef.current = nextCoins;
    collectionRef.current = next;
    setCoins(nextCoins);
    setCollection(next);
    persist({ collection: next, coins: nextCoins });
    const remaining = { ...trader, cardIds: trader.cardIds.filter((id) => id !== tradeTarget.id) };
    setTrader(remaining);
    saveTrader({ trader: remaining, nextTraderAt: remaining.expiresAt + TRADER_GAP_MS });
    setTradeTargetId(null);
    setOffer({});
    setOfferCoins(0);
  };


  const buildEchoPayment = () => {
    const pay = {};
    basePool.filter((c) => c.tier === "gilded").forEach((c) => { pay[c.id] = ECHO_COST.gildedEach; });
    let need = ECHO_COST.champion;
    for (const c of basePool.filter((x) => x.tier === "champion")) {
      if (need <= 0) break;
      const take = Math.min(need, collection[c.id] || 0);
      if (take > 0) { pay[c.id] = (pay[c.id] || 0) + take; need -= take; }
    }
    need = ECHO_COST.prismSignature;
    for (const c of basePool.filter((x) => x.tier === "prismSignature")) {
      if (need <= 0) break;
      const take = Math.min(need, collection[c.id] || 0);
      if (take > 0) { pay[c.id] = (pay[c.id] || 0) + take; need -= take; }
    }
    return pay;
  };

    if (!trader) return;
    if (coinsRef.current < TRADER_REFRESH_COST) return;
    const stock = rollTraderStock(pool);
    const nextTrader = { ...trader, cardIds: stock.cardIds, hasEcho: stock.hasEcho };
    const nextCoins = coinsRef.current - TRADER_REFRESH_COST;
    coinsRef.current = nextCoins;
    setTrader(nextTrader);
    setCoins(nextCoins);
    setTradeTargetId(null);
    setOffer({});
    saveTrader({ trader: nextTrader, nextTraderAt: nextTrader.expiresAt + TRADER_GAP_MS });
    persist({ coins: nextCoins });
  };

  const executeTrade = () => {
    if (!tradeTarget || !trader) return;
    if (tradeTarget.tier === "siblings" && !siblingEligibility.canTrade) return;
    const isEcho = tradeTarget.tier === "echo";
    if (isEcho && !echoEligibility.canTrade) return;
    if (!isEcho && !(tradeCheck && tradeCheck.ok)) return;
    const coinCost = isEcho ? 0 : coinsOffered;
    if (coinCost > coinsRef.current) return;

    const payment = isEcho ? buildEchoPayment() : offer;
    const next = { ...collectionRef.current };
    Object.entries(payment).forEach(([id, qty]) => {
      next[id] = (next[id] || 0) - qty;
      if (next[id] <= 0) delete next[id];
    });
    next[tradeTarget.id] = (next[tradeTarget.id] || 0) + 1;
    const nextCoins = coinsRef.current - coinCost;

    collectionRef.current = next;
    coinsRef.current = nextCoins;
    setCollection(next);
    setCoins(nextCoins);
    persist({ collection: next, coins: nextCoins });

    const remaining = { ...trader, cardIds: trader.cardIds.filter((id) => id !== tradeTarget.id) };
    setTrader(remaining);
    saveTrader({ trader: remaining, nextTraderAt: remaining.expiresAt + TRADER_GAP_MS });
    setTradeTargetId(null);
    setOffer({});
    setOfferCoins(0);
  };

  const fmtClock = (ms) => {
    const s = Math.ceil(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };

  const totalCards = pool.length;
  const totalPulled = Object.values(collection).reduce((a, b) => a + b, 0);
  const pct = Math.round((uniqueOwned / totalCards) * 100);

    (c) => (filterType === "all" || c.type === filterType) && (filterTier === "all" || c.tier === filterTier)
  );
  const visiblePool = filteredPool.slice(0, visibleCount);

  const bestCard = pack ? pack.cards[pack.cards.length - 1] : null;

          animation: holo-spin 4s linear infinite reverse; z-index: 2;

        .cutscene-card-wrap { z-index: 2; animation: cutscene-pop 0.7s cubic-bezier(.2,1.4,.4,1); }

        .cutscene-name { z-index: 2; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 16px; color: #e9e5f5; letter-spacing: 1px; text-align: center; }
        .cutscene-progress { z-index: 2; width: 220px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.15); overflow: hidden; }
        .cutscene-progress-fill { height: 100%; background: linear-gradient(90deg, #ff3ea5, #29e6d6); animation: cutscene-fill 8s linear forwards; }
        @keyframes cutscene-fill { from { width: 0%; } to { width: 100%; } }
        @media (prefers-reduced-motion: reduce) {

        <div className="battle-wrap">

            <>
              <div className="god-banner">✦ VICTORY ✦</div>
              <div className="battle-sub">
                {battle.reward && battle.reward.isChampionCapture
                  ? "A rare capture! Your defeated foe's creature transformed into a Champion!"
                  : "You won the battle and captured one of your opponent's creatures!"}
              </div>
              {battle.reward && (
                <div className="sequence-stage">
                  <Card card={battle.reward} size="large" isNew={battle.reward.isNew} count={collection[battle.reward.id]} />
                </div>
              )}
            </>
          ) : (
            <>
              <div className="binder-title">Defeated…</div>
              <div className="battle-sub">Your team was knocked out. Build a stronger squad and try again.</div>
            </>
          )}

          {(() => {
            const total = Object.values(battle.expGains || {}).reduce((a, b) => a + b, 0);
            return (
              <div className="exp-summary">
                <div className="exp-summary-title">EXP earned: {fmtValue(total)}</div>
                {Object.entries(battle.expGains || {}).map(([id, amt]) => {
                  const c = pool.find((x) => x.id === id);
                  return c ? <div key={id} className="exp-line">{c.name} +{fmtValue(amt)} EXP</div> : null;
                })}
                {(battle.levelUps || []).map((u) => (
                  <div key={u.id} className="exp-line levelup">⬆ {u.name} grew from Lv.{u.from} to Lv.{u.to}!</div>
                ))}
                {total === 0 && <div className="exp-line">No levelable card landed a knockout this time.</div>}
                <div className="exp-line dim">
                  {battle.status === "won"
                    ? `Next opponent: Lv.${battle.nextArena}`
                    : `Opponent level stays at Lv.${battle.nextArena} — you can retry it.`}
                </div>
              </div>
            );
          })()}

          {battle.grandPrize && !battle.prizeCard && (() => {
            const q = prizeSearch.trim().toLowerCase();
            const matches = pool.filter((c) =>
              (prizeDeck === "all" || (prizeDeck === "genesis" ? c.deck === "genesis" : c.deck !== "genesis")) &&
              (prizeTier === "all" || c.tier === prizeTier) &&
              (prizeType === "all" || c.type === prizeType) &&
              (!q || c.name.toLowerCase().includes(q))
            );
            return (
              <div className="prize-panel">
                <div className="echo-panel-title">🏆 Level 100 Victory — Choose ANY Card</div>
                <div className="echo-panel-sub">You defeated a full Lv.100 team. Pick any card in the game — gods included.</div>
                <div className="prize-filters">
                  <input className="prize-search" placeholder="Search by name…" value={prizeSearch}
                    onChange={(e) => { setPrizeSearch(e.target.value); setPrizeVisible(60); }} />
                  <select className="tier-select" value={prizeDeck} onChange={(e) => { setPrizeDeck(e.target.value); setPrizeVisible(60); }}>
                    <option value="all">Both decks</option>
                    <option value="core">Original deck</option>
                    <option value="genesis">Genesis deck</option>
                  </select>
                  <select className="tier-select" value={prizeTier} onChange={(e) => { setPrizeTier(e.target.value); setPrizeVisible(60); }}>
                    <option value="all">All rarities</option>
                    {TIER_DEFS.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
                  </select>
                  <select className="tier-select" value={prizeType} onChange={(e) => { setPrizeType(e.target.value); setPrizeVisible(60); }}>
                    <option value="all">All types</option>
                    {TYPES.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                </div>
                {prizePick && (
                  <div className="prize-confirm">
                    <span>Selected: <b>{prizePick.name}</b> ({TIER_MAP[prizePick.tier].label})</span>
                    <button className="open-btn" onClick={claimPrize}>Claim This Card</button>
                  </div>
                )}
                <div className="binder-grid offer-pool">
                  {matches.slice(0, prizeVisible).map((c) => (
                    <div key={c.id} className={`trade-pick ${prizePick && prizePick.id === c.id ? "picked" : ""}`} onClick={() => setPrizePick(c)}>
                      <Card card={c} size="small" owned={true} />
                    </div>
                  ))}
                </div>
                <div className="binder-footer">
                  <div className="binder-count">Showing {Math.min(prizeVisible, matches.length)} of {matches.length}</div>
                  {matches.length > prizeVisible && (
                    <button className="ghost-btn" onClick={() => setPrizeVisible((v) => v + 60)}>Show More</button>
                  )}
                </div>
              </div>
            );
          })()}
          {battle.prizeCard && (
            <div className="prize-panel">
              <div className="echo-panel-title">🏆 Prize claimed</div>
              <div className="sequence-stage">
                <Card card={battle.prizeCard} size="large" owned={true} count={collection[battle.prizeCard.id]} />
              </div>
            </div>
          )}
          <div className="opening-actions">
            <button className="ghost-btn primary-btn" onClick={resetBattle}>Battle Again</button>
            <button className="ghost-btn" onClick={goHome}>Back to Packs</button>
          </div>
        </div>
      )}

      {screen === "trader" && (
        <div className="trader-wrap">
          <div className="binder-header">
            <div className="binder-title">{trader ? "🧳 Wandering Trader" : "🧳 Trader"}</div>
            <div className={`trader-timer ${trader ? "here" : ""}`}>
              {trader ? `Leaves in ${fmtClock(msLeft)}` : `Arrives in ${fmtClock(msLeft)}`}
            </div>
          </div>

          {!trader ? (
            <div className="odds-note">
              The trader stays for 8 minutes, then returns 4 minutes after leaving.
              They carry {TRADER_STOCK} random cards — rarer cards are far less likely to be in stock, and there's
              a 0.25% chance they're carrying Echo itself (Neon and Drogen are twice as likely). Pay with cards of equal value, cards plus coins at ×2 the price,
              or coins alone at ×4 the price (Echo, Neon and Drogen accept cards only).
            </div>
          ) : (
            <>
              <div className="trade-panel-head">
                <div className="battle-sub" style={{ marginBottom: 0 }}>
                  Carrying {trader.cardIds.length} card{trader.cardIds.length === 1 ? "" : "s"}. Tap one to negotiate.
                </div>
                <button className="ghost-btn" onClick={refreshTraderStock} disabled={coins < TRADER_REFRESH_COST}>
                  🔄 Refresh Stock — ◈ {fmtValue(TRADER_REFRESH_COST)}
                </button>
              </div>
              <div className="binder-grid trader-stock">
                {trader.cardIds.map((id) => {
                  const c = pool.find((x) => x.id === id);
                  if (!c) return null;
                  return (
                    <div
                      key={id}
                      className={`trade-pick ${tradeTargetId === id ? "picked" : ""}`}
                      onClick={() => selectTradeTarget(id)}
                    >
                      {!collection[id] && <div className="missing-badge">NEW</div>}
                      <Card card={c} size="small" />
                      <div className="value-chip">◈ {fmtValue(cardValue(c))}</div>
                    </div>
                  );
                })}
              </div>

              {tradeTarget && tradeTarget.tier === "echo" && (
                <div className="echo-trade-panel">
                  <div className="echo-panel-title">❂ Trading for Echo</div>
                  <div className="echo-panel-sub">
                    Echo is the god of all types. The trader will only part with it if you've completed the dex
                    and can pay its true price.
                  </div>
                  <div className="req-list">
                    <div className={echoEligibility.missingCount === 0 ? "req ok" : "req"}>
                      {echoEligibility.missingCount === 0 ? "✓" : "✗"} Own every card in the game except Echo
                      {echoEligibility.missingCount > 0 && ` — ${fmtValue(echoEligibility.missingCount)} still missing`}
                    </div>
                    <div className={echoEligibility.championCount >= ECHO_COST.champion ? "req ok" : "req"}>
                      {echoEligibility.championCount >= ECHO_COST.champion ? "✓" : "✗"} Hold at least {ECHO_COST.champion} Champion cards
                      {` — you have ${echoEligibility.championCount}`}
                    </div>
                  </div>
                  <div className="echo-panel-sub" style={{ marginTop: 10 }}>
                    Price: one of every Gilded Rare, {ECHO_COST.champion} Champion, and {ECHO_COST.prismSignature} Prism
                    Signature cards (◈ {fmtValue(ECHO_COST_VALUE)} total).
                  </div>
                  <div className="req-list">
                    <div className={echoEligibility.gildedReady ? "req ok" : "req"}>
                      {echoEligibility.gildedReady ? "✓" : "✗"} One of each of the {TIER_COUNTS.gilded} Gilded Rares
                    </div>
                    <div className={echoEligibility.psCount >= ECHO_COST.prismSignature ? "req ok" : "req"}>
                      {echoEligibility.psCount >= ECHO_COST.prismSignature ? "✓" : "✗"} {ECHO_COST.prismSignature} Prism Signature cards
                      {` — you have ${echoEligibility.psCount}`}
                    </div>
                  </div>
                  <div className="echo-panel-sub" style={{ marginTop: 10 }}>Echo can only be traded for cards — the trader won't take coins for it.</div>
                  <div className="trade-btn-row">
                    <button className="open-btn" onClick={executeTrade} disabled={!echoEligibility.canTrade}>
                      {echoEligibility.canTrade ? "Trade for Echo" : "Requirements Not Met"}
                    </button>
                  </div>
                </div>
              )}

              {tradeTarget && tradeTarget.tier !== "echo" && (
                <div className="trade-panel">
                  <div className="trade-panel-head">
                    <div>
                      <div className="echo-panel-title">Trading for {tradeTarget.name}</div>
                      <div className="echo-panel-sub">
                        {isGodTarget
                          ? `Cards only — needs ◈ ${fmtValue(cardValue(tradeTarget))} in cards. Coins aren't accepted.`
                          : `Cards only ◈ ${fmtValue(cardValue(tradeTarget))} · Cards + coins ◈ ${fmtValue(cardValue(tradeTarget) * TRADER_MIXED_MULT)} (×${TRADER_MIXED_MULT}) · Coins only ◈ ${fmtValue(cardValue(tradeTarget) * TRADER_COIN_ONLY_MULT)} (×${TRADER_COIN_ONLY_MULT})`}
                      </div>
                    </div>
                    <div className={`trade-balance ${tradeCheck && tradeCheck.ok ? "ok" : ""}`}>
                      {tradeCheck && tradeCheck.ok
                        ? "Deal accepted ✓"

                    </div>
                  </div>

                  {!isGodTarget && tradeCheck && (
                    <div className="coin-offer-row">
                      <label className="coin-offer-label">Add coins</label>
                      <input
                        type="number" min="0" max={coins} step="100" value={offerCoins}
                        onChange={(e) => setOfferCoins(Math.max(0, Math.min(coins, Number(e.target.value) || 0)))}
                        className="coin-input"
                      />
                      <button className="ghost-btn" onClick={fillCoins}>Cover the rest with coins</button>
                      <button className="ghost-btn" onClick={() => setOfferCoins(0)}>Clear</button>
                      <div className="coin-offer-status">
                        {tradeCheck.mode === "cards" && "Paying with cards only"}
                        {tradeCheck.mode === "mixed" && `Cards + coins (price ×${TRADER_MIXED_MULT})`}
                        {tradeCheck.mode === "coins" && `Coins only (price ×${TRADER_COIN_ONLY_MULT})`}
                        {` · paid ◈ ${fmtValue(tradeCheck.paid)} of ◈ ${fmtValue(tradeCheck.required)}`}
                      </div>
                    </div>
                  )}

                  {tradeTarget.tier === "siblings" && (
                    <div className="echo-trade-panel" style={{ marginTop: 0, marginBottom: 14 }}>
                      <div className="echo-panel-sub">
                        {tradeTarget.name} is one of the Genesis siblings. The trader only sells to collectors who have
                        completed the Genesis deck.
                      </div>
                      <div className="req-list">
                        <div className={siblingEligibility.missingCount === 0 ? "req ok" : "req"}>
                          {siblingEligibility.missingCount === 0 ? "✓" : "✗"} Own every Genesis card except Champions and the siblings
                          {siblingEligibility.missingCount > 0 && ` — ${fmtValue(siblingEligibility.missingCount)} still missing`}
                        </div>
                        <div className={siblingEligibility.championCount >= 5 ? "req ok" : "req"}>
                          {siblingEligibility.championCount >= 5 ? "✓" : "✗"} Hold at least 5 Genesis Champions — you have {siblingEligibility.championCount}
                        </div>
                      </div>
                    </div>
                  )}

                  {Object.keys(offer).length > 0 && (
                    <div className="offer-row">
                      {Object.entries(offer).map(([id, qty]) => {
                        const c = pool.find((x) => x.id === id);
                        return (
                          <div key={id} className="offer-item" onClick={() => removeFromOffer(id)} title="Click to remove one">
                            <Card card={c} size="small" />
                            <div className="value-chip">×{qty} · ◈ {fmtValue(cardValue(c) * qty)}</div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  <div className="trade-btn-row">
                    <button className="open-btn" onClick={executeTrade}
                      disabled={!(tradeCheck && tradeCheck.ok) || (tradeTarget.tier === "siblings" && !siblingEligibility.canTrade)}>
                      Confirm Trade
                    </button>
                    {!isGodTarget && (
                      <button className="open-btn premium-btn" onClick={buyWithCoins}
                        disabled={coins < cardValue(tradeTarget) * TRADER_COIN_ONLY_MULT}>
                        Buy with coins only · ◈ {fmtValue(cardValue(tradeTarget) * TRADER_COIN_ONLY_MULT)}
                      </button>
                    )}
                  </div>

                  <div className="echo-panel-sub" style={{ marginTop: 16 }}>
                    Your cards — tap to add to the offer (the cheapest are listed first):
                  </div>
                  <div className="binder-grid offer-pool">
                    {tradableOwned.slice(0, offerVisible).map((c) => {
                      const owned = collection[c.id] || 0;
                      const used = offer[c.id] || 0;
                      return (
                        <div
                          key={c.id}
                          className={`trade-pick ${used > 0 ? "picked" : ""} ${used >= owned ? "exhausted" : ""}`}
                          onClick={() => addToOffer(c.id)}
                        >
                          <Card card={c} size="small" count={owned} />
                          <div className="value-chip">◈ {fmtValue(cardValue(c))} · {owned - used} left</div>
                        </div>
                      );
                    })}
                  </div>
                  {tradableOwned.length > offerVisible && (
                    <div className="binder-footer">
                      <div className="binder-count">Showing {offerVisible} of {fmtValue(tradableOwned.length)} (cheapest first)</div>
                      <button className="ghost-btn" onClick={() => setOfferVisible((v) => v + 120)}>Show More</button>
                    </div>
                  )}
                </div>
              )}
            </>
          )}
        </div>
      )}

      {screen === "shop" && (() => {
        const shopCard = shopCardId ? pool.find((c) => c.id === shopCardId) : null;
        const ownedCards = pool
          .filter((c) => collection[c.id] > 0 && c.category === "creature")
          .sort((a, b) => TIER_ORDER.indexOf(b.tier) - TIER_ORDER.indexOf(a.tier));
        return (
          <div className="trader-wrap">
            <div className="binder-header">
              <div className="binder-title">🛠 Move Shop</div>
              <div className="trader-timer here">◈ {fmtValue(coins)}</div>
            </div>
            <div className="battle-sub">
              Sell duplicate cards from your Binder to earn coins, then teach powerful new moves to cards strong
              enough to learn them. Every card has a limited number of attack slots (rarer cards have more) — you can swap its moves for any other move it owns.
            </div>

            <div className="detail-section-title">🍀 Luck Boosts</div>
            {clockNow < luckExpiresAt && (
              <div className="shop-note">Active now — ×{LUCK_MULT} rare+ odds for {fmtClock(luckExpiresAt - clockNow)} more.</div>
            )}
            <div className="battle-sub">
              Temporarily multiplies the odds of every tier above Rare by ×{LUCK_MULT} on every pack you open
              (stacks with Prismatic packs). Buying while one is active extends the timer.
            </div>
            <div className="shop-grid">
              {LUCK_OPTIONS.map((opt) => (
                <div key={opt.id} className={`shop-move ${coins >= opt.cost ? "" : "locked"}`}>
                  <div className="move-card-top">
                    <span className="move-card-name">{opt.label}</span>
                    <span className="move-card-pwr">×{LUCK_MULT}</span>
                  </div>
                  <div className="move-card-type">Boosts every pack you open during this window</div>
                  <button className="buy-btn" disabled={coins < opt.cost} onClick={() => buyLuckBoost(opt)}>
                    {coins < opt.cost ? "Not enough coins" : `Buy · ◈ ${fmtValue(opt.cost)}`}
                  </button>
                </div>
              ))}
            </div>

            <div className="detail-section-title">1 · Choose a card{ownedCards.length > 150 ? ` (your 150 strongest of ${fmtValue(ownedCards.length)})` : ""}</div>
            {ownedCards.length === 0 ? (
              <div className="odds-note">You don't own any creatures yet — open a pack first.</div>
            ) : (
              <div className="binder-grid offer-pool">
                {ownedCards.slice(0, 150).map((c) => (
                  <div
                    key={c.id}
                    className={`trade-pick ${shopCardId === c.id ? "picked" : ""}`}
                    onClick={() => { setShopCardId(c.id); setShopNote(""); setSwapInId(null); }}
                  >
                    <Card card={c} size="small" count={collection[c.id]} />
                    <div className="value-chip">{equippedOf(c, cardMoves[c.id], cardLoadout[c.id]).length}/{moveSlotsFor(c)} slots · {libraryOf(c, cardMoves[c.id]).length} moves</div>
                  </div>
                ))}
              </div>
            )}

            {shopCard && (() => {
              const slots = moveSlotsFor(shopCard);
              const eq = equippedOf(shopCard, cardMoves[shopCard.id], cardLoadout[shopCard.id]);
              const eqIds = eq.map((m) => m.id);
              const bench = libraryOf(shopCard, cardMoves[shopCard.id]).filter((m) => !eqIds.includes(m.id));
              const typeLine = (m) => `${TYPE_MAP[m.type] ? `${TYPE_MAP[m.type].icon} ${TYPE_MAP[m.type].name}` : m.type} move${m.type !== shopCard.type && shopCard.tier !== "echo" ? " (coverage)" : ""}`;
              return (
                <>
                  <div className="detail-section-title">2 · {shopCard.name}'s equipped moves ({eq.length}/{slots} slots)</div>
                  {shopNote && <div className="shop-note">{shopNote}</div>}
                  <div className="shop-grid">
                    {eq.map((m) => (
                      <div key={m.id} className="shop-move equipped">
                        <div className="move-card-top">
                          <span className="move-card-name">{m.name}</span>
                          <span className="move-card-pwr">PWR {m.power}</span>
                        </div>
                        <div className="move-card-type">{typeLine(m)}</div>
                        {swapInId ? (
                          <button className="buy-btn" onClick={() => equipMove(shopCard, swapInId, m.id)}>Replace this move</button>
                        ) : (
                          <button className="buy-btn unequip" disabled={eq.length <= 1} onClick={() => unequipMove(shopCard, m.id)}>Unequip</button>
                        )}
                      </div>
                    ))}
                  </div>

                  {bench.length > 0 && (
                    <>
                      <div className="detail-section-title">Move library — owned, not equipped</div>
                      <div className="shop-grid">
                        {bench.map((m) => (
                          <div key={m.id} className={`shop-move ${swapInId === m.id ? "swap-target" : ""}`}>
                            <div className="move-card-top">
                              <span className="move-card-name">{m.name}</span>
                              <span className="move-card-pwr">PWR {m.power}</span>
                            </div>
                            <div className="move-card-type">{typeLine(m)}</div>
                            <button className="buy-btn" onClick={() => equipMove(shopCard, m.id)}>
                              {eq.length < slots ? "Equip" : swapInId === m.id ? "Choose a move to replace…" : "Swap in…"}
                            </button>
                          </div>
                        ))}
                      </div>
                      {swapInId && <button className="ghost-btn" style={{ marginTop: 10 }} onClick={() => { setSwapInId(null); setShopNote(""); }}>Cancel swap</button>}
                    </>
                  )}

                  <div className="detail-section-title">3 · Buy a new move for {shopCard.name}</div>
                  <div className="shop-grid">
                    {SHOP_MOVES.map((m) => {
                      const check = canLearnMove(shopCard, m, cardMoves[shopCard.id] || []);
                      const afford = coins >= m.cost;
                      return (
                        <div key={m.id} className={`shop-move ${check.ok && afford ? "" : "locked"}`}>
                          <div className="move-card-top">
                            <span className="move-card-name">{m.name}</span>
                            <span className="move-card-pwr">PWR {m.power}</span>
                          </div>
                          <div className="move-card-type">
                            {TYPE_MAP[m.type] ? `${TYPE_MAP[m.type].icon} ${TYPE_MAP[m.type].name}` : m.type} ·
                            {` ${TIER_MAP[m.minTier].label}+ only`}
                          </div>
                          <button
                            className="buy-btn"
                            disabled={!check.ok || !afford}
                            onClick={() => buyMove(shopCard, m)}
                          >
                            {!check.ok ? check.why : !afford ? "Not enough coins" : `Buy · ◈ ${fmtValue(m.cost)}`}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </>
              );
            })()}
          </div>
        );
      })()}

      {screen === "binder" && (
        <div className="binder-wrap">
          <div className="binder-header">
            <div className="binder-title">Collection Binder</div>
            <div className="binder-pct">{uniqueOwned} / {totalCards} unique — {pct}%</div>
          </div>
          {collection[ECHO_CARD.id] > 0 && (
            <div className="echo-panel">
              <div className="echo-panel-title">❂ Echo — God of All Types</div>
              <div className="echo-panel-sub">Echo can take on any elemental form. Choose one and its color changes to match.</div>
              <div className="echo-type-row">
                <button className={`echo-type-btn ${!echoType ? "active" : ""}`} onClick={() => setEchoForm(null)}>❂ True Form</button>
                {TYPES.map((t) => (
                  <button key={t.id} className={`echo-type-btn ${echoType === t.id ? "active" : ""}`} onClick={() => setEchoForm(t.id)}>
                    {t.icon} {t.name}
                  </button>
                ))}
              </div>
            </div>
          )}

          <div className="echo-panel">
            <div className="echo-panel-title">💰 Auto-Sell by Rarity</div>
            <div className="echo-panel-sub">Sell every card you own of a chosen rarity in one click, at its full value.</div>
            {autoSellNote && <div className="shop-note">{autoSellNote}</div>}
            <div className="auto-sell-row">
              <select className="tier-select" value={autoSellTier} onChange={(e) => setAutoSellTier(e.target.value)}>
                {TIER_DEFS.filter((t) => !GOD_TIERS.includes(t.id)).map((t) => (
                  <option key={t.id} value={t.id}>
                    {t.label} (◈ {fmtValue(TIER_VALUES[t.id])}{t.id === "champion" ? ", Genesis ◈ " + fmtValue(GENESIS_CHAMPION_VALUE) : ""} each)
                  </option>
                ))}
              </select>
              <button className="sell-btn" onClick={() => sellByRarity(autoSellTier)}>
                Sell All {TIER_MAP[autoSellTier].label} Cards
              </button>
            </div>
          </div>
          <div className="filter-row">
            <button className={`type-pill ${filterType === "all" ? "active" : ""}`} onClick={() => setFilterType("all")}>All</button>
            {TYPES.map((t) => (
              <button key={t.id} className={`type-pill ${filterType === t.id ? "active" : ""}`} onClick={() => setFilterType(t.id)}>
                {t.icon} {t.name}
              </button>
            ))}
            <select className="tier-select" value={filterTier} onChange={(e) => setFilterTier(e.target.value)}>
              <option value="all">All Rarities</option>
              {TIER_DEFS.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
          </div>
          <div className="binder-grid">
            {visiblePool.map((c) => (
              <div key={c.id} style={{ textAlign: "center" }} className="binder-cell" onClick={() => setDetailCard(c)}>
                <Card card={c} size="small" owned={!!collection[c.id]} count={collection[c.id] || 0} />
                <div className="value-chip">◈ {fmtValue(cardValue(c))}</div>
              </div>
            ))}
          </div>
          <div className="binder-footer">
            <div className="binder-count">Showing {visiblePool.length} of {filteredPool.length}</div>
            {filteredPool.length > visibleCount && (
              <button className="ghost-btn" onClick={() => setVisibleCount((v) => v + 120)}>Show More</button>
            )}
          </div>
        </div>
      )}
    </div>
    </LevelsContext.Provider>
    </EchoTypeContext.Provider>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
